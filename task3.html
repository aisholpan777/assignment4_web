<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow p-4">
                <h1 class="h2 mb-4">Reserve a table</h1>

                <form action="#" method="get">
                    <div class="mb-3">
                        <label for="name" class="form-label">Your name</label>
                        <input type="text" class="form-control" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" required>
                    </div>

                    <div class="mb-3">
                        <label for="guests" class="form-label">Guests</label>
                        <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" step="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="reservationDate" class="form-label">Date</label>
                        <input type="date" class="form-control" id="reservationDate" name="reservationDate" required>
                    </div>

                    <fieldset class="mb-3">
                        <legend class="form-label">Seating</legend>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="seating" id="inside" value="inside" checked>
                            <label class="form-check-label" for="inside">Inside</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace">
                            <label class="form-check-label" for="terrace">Terrace</label>
                        </div>
                    </fieldset>

                    <div class="mb-3">
                        <label for="mealType" class="form-label">Meal type</label>
                        <select class="form-select" id="mealType" name="mealType" required>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="comments" class="form-label">Comments</label>
                        <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" name="terms" value="accepted" required>
                        <label class="form-check-label" for="terms">I agree to the terms</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Reserve</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
