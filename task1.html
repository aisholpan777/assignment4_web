<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a train ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F4F7F5;
            color: #16302B;
        }

        .ticket-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            max-width: 900px;
            margin: 40px auto;
        }

        .ticket-header {
            background-color: #0F6B5F;
            color: white;
            padding: 24px 32px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .ticket-body {
            padding: 32px;
        }

        .btn-check:checked + .btn-outline-custom {
            background-color: #0F6B5F;
            color: white;
            border-color: #0F6B5F;
        }

        .btn-outline-custom {
            border: 1px solid #ced4da;
            color: #16302B;
            border-radius: 20px;
            padding: 6px 20px;
            font-weight: 500;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #dee2e6;
        }

        .form-control:focus,
        .form-select:focus,
        .btn:focus-visible,
        .form-check-input:focus {
            border-color: #0F6B5F;
            box-shadow: 0 0 0 0.25rem rgba(15, 107, 95, 0.25);
        }

        .btn-find {
            background-color: #F2A93B;
            border: none;
            color: #16302B;
            font-weight: 600;
            border-radius: 8px;
            padding: 12px;
        }

        .btn-find:hover {
            background-color: #d99533;
            color: #16302B;
        }

        .btn-clear {
            background-color: transparent;
            border: 1px solid #ced4da;
            color: #16302B;
            font-weight: 600;
            border-radius: 8px;
            padding: 12px;
        }

        .btn-clear:hover {
            background-color: #E6EFEC;
            color: #16302B;
        }

        @media (max-width: 767.98px) {
            .ticket-card {
                margin: 16px auto;
            }

            .ticket-header {
                padding: 20px;
            }

            .ticket-body {
                padding: 20px;
            }

            .action-buttons {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .btn-find-container {
                order: 1;
            }

            .btn-clear-container {
                order: 2;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ticket-card">
        <div class="ticket-header">
            Book a train ticket
        </div>

        <div class="ticket-body">
            <form>
                <div class="mb-4">
                    <input type="radio" class="btn-check" name="tripType" id="oneWay" value="oneWay" autocomplete="off" checked>
                    <label class="btn btn-outline-custom me-2" for="oneWay">One way</label>

                    <input type="radio" class="btn-check" name="tripType" id="roundTrip" value="roundTrip" autocomplete="off">
                    <label class="btn btn-outline-custom" for="roundTrip">Round trip</label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="fromCity" class="form-label text-muted small">From</label>
                        <input type="text" class="form-control" id="fromCity" name="fromCity" required>
                    </div>

                    <div class="col-md-6">
                        <label for="toCity" class="form-label text-muted small">To</label>
                        <input type="text" class="form-control" id="toCity" name="toCity" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="departureDate" class="form-label text-muted small">Departure</label>
                        <input type="date" class="form-control" id="departureDate" name="departureDate" required>
                    </div>

                    <div class="col-md-4">
                        <label for="returnDate" class="form-label text-muted small">Return</label>
                        <input type="date" class="form-control" id="returnDate" name="returnDate">
                    </div>

                    <div class="col-md-4">
                        <label for="passengers" class="form-label text-muted small">Passengers</label>
                        <select class="form-select" id="passengers" name="passengers">
                            <option value="1" selected>1 adult</option>
                            <option value="2">2 adults</option>
                            <option value="3">3 adults</option>
                            <option value="4">4 adults</option>
                            <option value="5">5 adults</option>
                            <option value="6">6 adults</option>
                        </select>
                    </div>
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label text-muted small">Carriage class</legend>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="carriageClass" id="seat" value="seat" required>
                        <label class="form-check-label" for="seat">Seat</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="carriageClass" id="coupe" value="coupe" required>
                        <label class="form-check-label" for="coupe">Coupé</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="carriageClass" id="sleeper" value="sleeper" required>
                        <label class="form-check-label" for="sleeper">Sleeper</label>
                    </div>
                </fieldset>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="phone" class="form-label text-muted small">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label text-muted small">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="smsCheck" name="smsCheck">
                    <label class="form-check-label text-secondary" for="smsCheck">Also send the ticket by SMS</label>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rulesCheck" name="rulesCheck" required>
                    <label class="form-check-label text-secondary" for="rulesCheck">I agree with the carriage rules</label>
                </div>

                <div class="row action-buttons">
                    <div class="col-md-6 btn-clear-container">
                        <button type="reset" class="btn btn-clear w-100">Clear</button>
                    </div>

                    <div class="col-md-6 btn-find-container">
                        <button type="submit" class="btn btn-find w-100">Find trains</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const tripTypeInputs = document.querySelectorAll('input[name="tripType"]');
    const returnDate = document.getElementById('returnDate');

    function updateReturnDate() {
        const isRoundTrip = document.getElementById('roundTrip').checked;
        returnDate.required = isRoundTrip;
        returnDate.disabled = !isRoundTrip;

        if (!isRoundTrip) {
            returnDate.value = '';
        }
    }

    tripTypeInputs.forEach(input => {
        input.addEventListener('change', updateReturnDate);
    });

    updateReturnDate();
</script>

</body>
</html>
